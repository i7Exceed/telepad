<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#151A28" />
      <stop offset="100%" stop-color="#07090E" />
    </radialGradient>

    <!-- Vibrant Cyber Gradient -->
    <linearGradient id="primaryNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Canvas -->
  <rect width="500" height="500" rx="105" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="4"/>

  <!-- Tele / Wireless Broadcast Waves (Low Latency Stream) -->
  <path d="M 170 125 A 95 95 0 0 1 330 125" fill="none" stroke="#00F0FF" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 14" opacity="0.45"/>
  <path d="M 195 152 A 65 65 0 0 1 305 152" fill="none" stroke="#00F0FF" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 8" opacity="0.75"/>
  <path d="M 220 178 A 36 36 0 0 1 280 178" fill="none" stroke="url(#cyanAccent)" stroke-width="7" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Gamepad Body -->
  <path d="M 148 215 
           C 180 205, 320 205, 352 215 
           C 400 230, 424 315, 398 370 
           C 378 412, 326 388, 306 342 
           C 286 304, 214 304, 194 342 
           C 174 388, 122 412, 102 370 
           C 76 315, 100 230, 148 215 Z" 
        fill="#0D111D" 
        stroke="url(#primaryNeon)" 
        stroke-width="7" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Grip Contours -->
  <path d="M 125 285 C 130 338, 150 358, 175 352" fill="none" stroke="#1A2338" stroke-width="5" stroke-linecap="round"/>
  <path d="M 375 285 C 370 338, 350 358, 325 352" fill="none" stroke="#1A2338" stroke-width="5" stroke-linecap="round"/>

  <!-- D-Pad (Left Controls) -->
  <g transform="translate(170, 275)">
    <rect x="-9" y="-28" width="18" height="56" rx="4" fill="#171E30" stroke="#00F0FF" stroke-width="2"/>
    <rect x="-28" y="-9" width="56" height="18" rx="4" fill="#171E30" stroke="#00F0FF" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#00F0FF" filter="url(#neonGlow)"/>
  </g>

  <!-- ABXY Action Buttons (Right Controls) -->
  <g transform="translate(330, 275)">
    <!-- Y Button -->
    <circle cx="0" cy="-21" r="7.5" fill="#171E30" stroke="#FFD600" stroke-width="2"/>
    <!-- A Button -->
    <circle cx="0" cy="21" r="7.5" fill="#171E30" stroke="#00FF66" stroke-width="2"/>
    <!-- X Button -->
    <circle cx="-21" cy="0" r="7.5" fill="#171E30" stroke="#00F0FF" stroke-width="2"/>
    <!-- B Button -->
    <circle cx="21" cy="0" r="7.5" fill="#171E30" stroke="#FF0055" stroke-width="2"/>
  </g>

  <!-- Center Status Nexus / Relay Hub -->
  <circle cx="250" cy="254" r="13" fill="#080A0F" stroke="url(#primaryNeon)" stroke-width="3.5"/>
  <circle cx="250" cy="254" r="5" fill="#00F0FF" filter="url(#neonGlow)"/>
</svg>
