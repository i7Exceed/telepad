name: telepad
description: "Wireless physical controller relay and virtual gamepad hub for Windows PC gaming."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  gamepads: ^0.1.7
  vibration: ^3.1.2
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
