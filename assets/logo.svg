<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121D" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>

    <!-- Vibrant Gradient -->
    <linearGradient id="teleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Banner Card Base -->
  <rect width="1000" height="280" rx="32" fill="url(#bannerBg)" stroke="#1E2638" stroke-width="2"/>

  <!-- Left Icon Group -->
  <g transform="translate(60, 40)">
    <!-- Wireless Wave Accents -->
    <path d="M 60 40 A 55 55 0 0 1 140 40" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6" opacity="0.6"/>
    <path d="M 75 56 A 35 35 0 0 1 125 56" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" filter="url(#logoGlow)"/>

    <!-- Mini Gamepad Contour -->
    <path d="M 45 85 C 65 80, 135 80, 155 85 C 185 95, 195 145, 180 175 C 168 198, 140 188, 128 162 C 118 142, 82 142, 72 162 C 60 188, 32 198, 20 175 C 5 145, 15 95, 45 85 Z"
          fill="#131929" stroke="url(#teleGrad)" stroke-width="4.5" stroke-linejoin="round" filter="url(#logoGlow)"/>

    <!-- DPad -->
    <g transform="translate(62, 125)">
      <rect x="-4" y="-12" width="8" height="24" rx="2" fill="#1C243B" stroke="#00F0FF" stroke-width="1.2"/>
      <rect x="-12" y="-4" width="24" height="8" rx="2" fill="#1C243B" stroke="#00F0FF" stroke-width="1.2"/>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(138, 125)">
      <circle cx="0" cy="-9" r="3.5" fill="#FFD600"/>
      <circle cx="0" cy="9" r="3.5" fill="#00FF66"/>
      <circle cx="-9" cy="0" r="3.5" fill="#00F0FF"/>
      <circle cx="9" cy="0" r="3.5" fill="#FF0055"/>
    </g>

    <!-- Center Pulse -->
    <circle cx="100" cy="115" r="4" fill="#00F0FF" filter="url(#logoGlow)"/>
  </g>

  <!-- Typography / Brand Heading -->
  <text x="300" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="70" font-weight="900" fill="url(#teleGrad)" letter-spacing="1.5">
    TelePad
  </text>

  <!-- Badge / Release Tag -->
  <rect x="585" y="68" width="82" height="28" rx="8" fill="#1E293B" stroke="#00F0FF" stroke-width="1.2"/>
  <text x="626" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#00F0FF" text-anchor="middle">v1.0.0</text>

  <!-- Subtitle -->
  <text x="304" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0">
    Wireless Physical Controller Relay &amp; Virtual Gamepad Hub
  </text>

  <!-- Description / Author Signature -->
  <text x="304" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94A3B8">
    Bridge Razer Kishi, GameSir, Backbone &amp; Touch Controls to Windows PC with Ultra-Low Latency UDP
  </text>

  <g transform="translate(304, 218)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#64748B">
      Architected &amp; Maintained by <tspan fill="#38BDF8">@i7Exceed</tspan> • Open-Source MIT License
    </text>
  </g>
</svg>
